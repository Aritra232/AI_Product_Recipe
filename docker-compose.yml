services:
  ai-search:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tomatoes-ai-search
    env_file:
      - .env
    ports:
      - "7011:7011"
    volumes:
      - ./Service/CSV:/app/Service/CSV
      - ./Service/data:/app/Service/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7011/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  indexer:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      ai-search:
        condition: service_healthy
    volumes:
      - ./Service/CSV:/app/Service/CSV
      - ./Service/data:/app/Service/data
    command: >
      python -c "import urllib.request;
      req = urllib.request.Request('http://ai-search:7011/admin/import-csv', method='POST');
      print(urllib.request.urlopen(req, timeout=1200).read().decode())"
    restart: "no"
